# タグ (v1.2.3 のような形) をプッシュすると、各 OS 向けの実行ファイルを作って GitHub の Release に添付する
# 手動で試すときは、GitHub の Actions タブからこのワークフローを選んで「Run workflow」を押す (Release は作らず、成果物だけ残る)
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    env:
      # タグから動いたときはタグ名 (v0.3.0 など)、手動のときは dev と実行番号
      NAME: Tsumiki-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dev{0}', github.run_number) }}-${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Linux の Native AOT は clang と zlib が要る
      - name: Linux の依存を入れる
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # テストは各 OS で動くかの確認。落ちても実行ファイルは作る (結果は Actions の画面で見る)
      - name: テスト
        continue-on-error: true
        run: dotnet test Tsumiki.Tests/Tsumiki.Tests.csproj -c Release

      - name: 発行 (Native AOT)
        run: dotnet publish Tsumiki.csproj -c Release -r ${{ matrix.rid }} -o publish/${{ matrix.rid }}

      - name: 固める (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.rid }}/Tsumiki.exe -DestinationPath "$env:NAME.zip"

      - name: 固める (Linux・macOS)
        if: runner.os != 'Windows'
        run: tar -czf "$NAME.tar.gz" -C publish/${{ matrix.rid }} Tsumiki

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
